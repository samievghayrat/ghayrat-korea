<!doctype html>
<html lang="ru">
<head>

        body {
            margin: 0;

            padding: 28px;
            background: #f7faf8;
            color: #15251e;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        main { max-width: 340px; }
        .mark {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            border-radius: 22px;
            background: #176b4a;
            color: #fff;
            font-size: 34px;
        }
        h1 { margin: 0 0 10px; font-size: 25px; }
        p { margin: 0 0 24px; color: #617168; line-height: 1.55; }
        a {
            display: block;
            padding: 14px 20px;
            border-radius: 14px;
            background: #176b4a;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <div class="mark">↻</div>

    <p>Проверьте интернет и попробуйте открыть каталог ещё раз.</p>
