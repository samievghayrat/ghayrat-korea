name: Refresh Encar catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-encar-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download current Encar inventory
        run: npm run download:encar

      - name: Validate downloaded inventory
        run: |
          node -e "const s=require('./src/data/encar-snapshot.json'); if(!s.generatedAt || !Array.isArray(s.cars) || s.cars.length < 150000) throw new Error('Downloaded Encar inventory is incomplete'); console.log('Validated', s.cars.length, 'cars at', s.generatedAt)"

      - name: Publish catalog update
        shell: bash
        run: |
          if git diff --quiet -- src/data/encar-snapshot.json; then
            echo "Encar inventory is already current."
            exit 0
          fi

          git config user.name "GHAYRAT Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/encar-snapshot.json
          git commit -m "Update Encar catalog"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
